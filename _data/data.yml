profile:
  show: true
  order: 1
  title: Profile
  description: |
    Software Engineer building healthcare enrollment applications for the Centers for Medicare & Medicaid Services (CMS). Sole backend engineer on the project, owning Ruby on Rails development, background job infrastructure, CI/CD, security remediation, and observability. Open-source contributor whose Puma instrumentation shipped in New Relic's official Ruby agent.

experience:
  show: true
  order: 2
  title: Experience
  description: |

  items:
    - company: Oddball
      link: 'https://oddball.io'
      tags: Full-time, Remote
      date: 2025.06 - Present
      role: Software Engineer I
      location: Remote
      description: |
        + Sole backend engineer on the Enroll team for HealthCare.gov's enrollment application (Ruby on Rails, Puma, Solid Queue, PostgreSQL, AWS ECS, Terraform, New Relic), responsible for backend architecture, reliability, and delivery.
        + Designed and shipped Puma server-statistics instrumentation in New Relic's official Ruby agent, resolving missing metrics in forked deployments; released in [`newrelic_rpm` 10.7.0](https://docs.newrelic.com/docs/apm/agents/ruby-agent/instrumented-gems/puma-instrumentation/) ([newrelic-ruby-agent#3578](https://github.com/newrelic/newrelic-ruby-agent/pull/3578)) and [credited by name in the release notes](https://github.com/newrelic/newrelic-ruby-agent/blob/main/CHANGELOG.md#v1070).
        + Reported and fixed a FIPS compliance defect in the same agent — a dead MD5 import flagged in federal environments ([newrelic-ruby-agent#3470](https://github.com/newrelic/newrelic-ruby-agent/pull/3470)).
        + Integrated CMS Marketplace/FFM APIs, strengthening timeout, retry, and failure handling and diagnosing submission timeouts that surfaced as generic consumer errors; hardened the JWT token-decode middleware authenticating API access.
        + Migrated background processing from Que to Solid Queue and implemented queue-depth autoscaling using CloudWatch and Terraform across four environments; recovered a stalled worker after database reboots with fail-fast restart and worker health monitoring.
        + Leading a multi-version framework modernization from Rails 7.1 to 8.1, including Rack 3 and Ruby 4 upgrades, sequenced to land ahead of a federal code freeze.
        + Automated database migrations across five environments, adding `strong_migrations` checks and lock/statement timeouts to reduce deployment risk.
        + Built the application-side integration for an AI-powered plan filtering feature (request validation, error handling, feature flagging, usage monitoring); presented it at the customer's security pen test review and demoed the API at a CMS AI office hours session with AWS.
        + Built an internal developer tool that steps through complex Medicare enrollment scenario-matching logic, reducing team reliance on manual code tracing.
        + Partnered with operations to identify a module load-order regression behind a fleet-wide 500 outage, and specified the boot-time guard that shipped to prevent recurrence.
        + Joined the cross-contract security team as the only non-lead engineer, participating in security review across contract projects.

    - company: Oddball
      link: 'https://oddball.io'
      tags: Full-time, Remote
      date: 2024.06 - 2025.06
      role: Associate Software Engineer
      location: Remote
      description: |
        + Developed backend logic and RSpec coverage for Medicare enrollment transition handling, spanning nearly all of the project's 35 scenarios.
        + Upgraded the application from Rails 7.0 to 7.1, including dependency upgrades, test framework migration, and ongoing CVE remediation across backend dependencies.
        + Authored a discovery document comparing background job architectures to support future infrastructure decisions.
        + Participated in three production incident responses via PagerDuty, coordinating with operations teams and CMS stakeholders on bridge calls.
        + Refactored legacy frontend components and improved accessibility labeling for Section 508 compliance.

    - company: Cedar Heights Elementary School
      link: 'https://ches.woodwardps.net'
      tags: Full-time
      date: 2015.05 - 2022.06
      role: Music Teacher
      location: Woodward, Oklahoma
      description: |
        + Planned and delivered a full K-6 music curriculum, coordinating schedules, budgets, and public performances across the school year.
        + Wrote and secured program funding: an Oklahoma Arts Council grant that brought visiting performing artists into the school, plus local grants and DonorsChoose projects that equipped the classroom with music stands, tubanos, and Orff instruments.

